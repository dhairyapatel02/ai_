name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Tests never call real external APIs; these only satisfy config parsing.
  DATABASE_URL: postgresql://devimpact:devimpact_password@localhost:5432/devimpact
  DATABASE_URL_TEST: postgresql://devimpact:devimpact_password@localhost:5432/devimpact_test
  REDIS_URL: redis://localhost:6379
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Audit API production dependencies (web is gated after the Next.js upgrade in P09)
        run: npm audit --omit=dev --workspace=apps/api --audit-level=high

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devimpact
          POSTGRES_PASSWORD: devimpact_password
          POSTGRES_DB: devimpact_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devimpact" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:int

  e2e:
    name: Build + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devimpact
          POSTGRES_PASSWORD: devimpact_password
          POSTGRES_DB: devimpact
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devimpact" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:deploy
      - run: npm run db:seed
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 240
      - name: Health endpoint
        run: curl --fail --silent --show-error http://localhost:4000/api/health
      - name: Web responds
        run: curl --fail --silent --show-error --output /dev/null http://localhost:3000/dashboard
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
