name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Tests never call real external APIs; these only satisfy config parsing.
  DATABASE_URL: postgresql://devimpact:devimpact_password@localhost:5432/devimpact
  DATABASE_URL_TEST: postgresql://devimpact:devimpact_password@localhost:5432/devimpact_test
  REDIS_URL: redis://localhost:6379
  NEXT_TELEMETRY_DISABLED: 1
  # Test-only secrets (never real). Integration tests override them with their own fixtures.
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production-0123
  TOKEN_ENCRYPTION_KEYS: '1:Y2ktb25seS10b2tlbi1rZXktbm90LWZvci1wcm9kISE='
  TOKEN_ENCRYPTION_ACTIVE_KEY: 1
  OAUTH_STATE_SECRET: ci-only-oauth-state-secret-not-for-production-0123

jobs:
  quality:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Design tokens (WCAG contrast, app copy in sync with docs/v2/design)
        run: npm run check:tokens
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies (API + web)
        # --omit=optional: better-auth (web) declares vitest as an *optional* peer, so npm counts the
        # dev-only test runner (and its picomatch advisory, unfixed in every version) as a production
        # dependency. Tracked as DEBT-11.
        run: |
          npm audit --omit=dev --omit=optional --workspace=apps/api --audit-level=high
          npm audit --omit=dev --omit=optional --workspace=apps/web --audit-level=high

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devimpact
          POSTGRES_PASSWORD: devimpact_password
          POSTGRES_DB: devimpact_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devimpact" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:int

  e2e:
    name: Build + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devimpact
          POSTGRES_PASSWORD: devimpact_password
          POSTGRES_DB: devimpact
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devimpact" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:deploy
      - run: npm run db:seed
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright traces/screens on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 240
      - name: Health endpoint
        run: curl --fail --silent --show-error http://localhost:4000/api/health
      - name: Web responds
        run: |
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/sign-in
      - name: Auth wiring (JWKS served by web; API rejects anonymous calls; dev login off)
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/auth/jwks | grep -q '"keys"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/dev-login)" = 404
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
