# Full stack: `docker compose up --build` (create `.env` from `.env.example` first if you want
# AI/GitHub keys; it is optional). Explicit project name avoids invalid image tags when the repo
# is cloned into a directory such as `ai_` (OPS-09).
name: devimpact

# Secrets below default to compose-local values so `docker compose up` works out of the box.
# They are NOT the .env.example values (those are refused in production builds), but they are
# public: set real ones in `.env` before exposing this stack anywhere (README → Docker).
x-api-env: &api-env
  DATABASE_URL: postgresql://devimpact:devimpact_password@postgres:5432/devimpact
  REDIS_URL: redis://redis:6379
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  RUN_WORKER_IN_API: 'false'
  # The browser-facing issuer is localhost:3000; inside the network the API reaches the web app as web:3000.
  AUTH_JWT_ISSUER: ${WEB_URL:-http://localhost:3000}
  AUTH_JWKS_URL: http://web:3000/api/auth/jwks
  TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-1:Y29tcG9zZS1sb2NhbC1vbmx5LXRva2VuLWtleS0hISE=}
  TOKEN_ENCRYPTION_ACTIVE_KEY: ${TOKEN_ENCRYPTION_ACTIVE_KEY:-1}
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-compose-local-only-oauth-state-secret-0123456789}
  UNSUBSCRIBE_TOKEN_SECRET: ${UNSUBSCRIBE_TOKEN_SECRET:-compose-local-only-unsubscribe-secret-0123456789}
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
  EMAIL_FROM: ${EMAIL_FROM:-DevImpact <digest@devimpact.local>}
  SMTP_URL: ${SMTP_URL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devimpact
      POSTGRES_PASSWORD: devimpact_password
      POSTGRES_DB: devimpact
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devimpact']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: devimpact-api
    ports:
      - '4000:4000'
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      API_PORT: '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    # Same image as the API (identical build is served from cache).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: devimpact-api
    command: ['node', 'dist/worker.js']
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      RUN_MIGRATIONS: 'false'
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Healthy while the worker touched its heartbeat file within the last minute.
      test: ['CMD-SHELL', 'test -n "$(find /tmp/worker-heartbeat -mmin -1 2>/dev/null)"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    image: devimpact-web
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://devimpact:devimpact_password@postgres:5432/devimpact
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-compose-local-only-better-auth-secret-0123456789}
      # Server Components call the API inside the compose network (the browser uses localhost:4000).
      API_INTERNAL_URL: http://api:4000/api
      # Production build: dev login is always off here, whatever ENABLE_DEV_LOGIN says.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
