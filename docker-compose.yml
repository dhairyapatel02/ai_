version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: devimpact
      POSTGRES_PASSWORD: devimpact_password
      POSTGRES_DB: devimpact
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devimpact']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://devimpact:devimpact_password@postgres:5432/devimpact
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=4000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker
    environment:
      - DATABASE_URL=postgresql://devimpact:devimpact_password@postgres:5432/devimpact
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
